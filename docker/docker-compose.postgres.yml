services:
  postgres:
    image: postgres:17-alpine
    container_name: mcp-secure-db-postgres
    environment:
      POSTGRES_DB: mcp_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test_pw
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_analytics"]
      interval: 2s
      timeout: 2s
      retries: 15
