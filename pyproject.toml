[project]
name = "mcp-secure-db"
version = "1.0.0"
description = "Enterprise-grade, 4-layer sandboxed analytical database MCP server built natively on mcp-use for Manufact Cloud"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Hamza Ali" }
]
dependencies = [
    "mcp-use>=1.3.0",
    "duckdb>=1.1.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.uv]
managed = true
